<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#274DF5",
                        "primary-dark": "#0E1B87",
                        "background": "#F2F2F2",
                        "surface": "#FFFFFF",
                        "text-main": "#1B1B1C",
                        "text-body": "#59595B",
                        "border-subtle": "#E5E7EB",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Outfit", "sans-serif"],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px rgba(27, 27, 28, 0.05)',
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.04)',
                        'hover': '0 10px 40px rgba(39, 77, 245, 0.12)',
                        'card': '0 2px 10px rgba(27, 27, 28, 0.03), 0 10px 30px rgba(27, 27, 28, 0.04)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.7s ease-out forwards',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            :root {
                --accent-color: #274DF5;
                --scroll-y: 0;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                @apply bg-background text-text-main font-sans antialiased selection:bg-primary/20 selection:text-primary-dark transition-colors duration-500;
                overflow-y: scroll;
            }
            
            h1, h2, h3, h4, h5, h6 {
                @apply font-display tracking-tight text-text-main;
            }

            .glass-panel {
                @apply bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm transition-all duration-300;
            }
            .glass-card {
                @apply bg-surface rounded-[24px] border border-gray-100 shadow-card transition-all duration-300 hover:shadow-hover hover:-translate-y-1;
            }
            .btn-primary {
                @apply bg-primary text-white font-medium rounded-full px-6 py-3 shadow-md hover:bg-primary-dark hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all duration-300;
            }
            .btn-secondary {
                @apply bg-white text-text-main font-medium rounded-full px-6 py-3 border border-gray-200 shadow-sm hover:border-gray-300 hover:bg-gray-50 active:scale-95 transition-all duration-300;
            }
            
            .text-accent {
                @apply text-primary font-medium;
            }
            
            .reveal {
                @apply opacity-0 translate-y-6;
                transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease-out;
                will-change: transform, opacity;
            }
            .reveal.active {
                @apply opacity-100 translate-y-0;
            }

            ::-webkit-scrollbar {
                width: 10px;
            }
            ::-webkit-scrollbar-track {
                background: #F2F2F2;
            }
            ::-webkit-scrollbar-thumb {
                background: #D1D5DB;
                border: 2px solid #F2F2F2;
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #9CA3AF;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background text-text-main font-sans overflow-x-hidden selection:bg-primary/20 selection:text-primary-dark">
    <div id="root"></div>
    <script>
        const root = document.documentElement;
        let scrollY = window.scrollY;
        
        const updateScroll = () => {
          scrollY = window.scrollY;
          root.style.setProperty('--scroll-y', scrollY);
        };
        
        window.addEventListener('scroll', () => {
          requestAnimationFrame(updateScroll);
        }, { passive: true });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
